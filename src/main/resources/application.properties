spring.application.name=trainingacademy

spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}localhost:3306/trainingacademymanagement?createDatabaseIfNotExist=true
spring.datasource.username={MYSQL_USER}
spring.datasource.password={MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=8080
